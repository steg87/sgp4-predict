[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "v3.6.2"

[[repos.hooks]]
id = "prettier"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "no-push-to-main"
name = "prevent push to main"
language = "system"
entry = "bash -c 'if [ \"$(git rev-parse --abbrev-ref HEAD)\" = \"main\" ]; then echo \"Direct commit to main is not allowed. Use a feature branch and open a PR.\"; exit 1; fi'"
stages = ["pre-commit"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "lint"
name = "cargo fmt + clippy"
language = "system"
entry = "make lint"
stages = ["pre-commit"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "test"
name = "cargo test"
language = "system"
entry = "make test"
stages = ["pre-push"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "py-test"
name = "python bindings test"
language = "system"
entry = "bash -c 'cd sgp4-predict-py && make test'"
stages = ["pre-push"]
always_run = true
pass_filenames = false
