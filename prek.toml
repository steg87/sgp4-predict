[[repos]]
repo = "local"

[[repos.hooks]]
id = "lint"
name = "cargo fmt + clippy"
language = "system"
entry = "make lint"
stages = ["pre-commit"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "test"
name = "cargo test"
language = "system"
entry = "make test"
stages = ["pre-push"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "py-test"
name = "python bindings test"
language = "system"
entry = "bash -c 'cd sgp4-predict-py && make test'"
stages = ["pre-push"]
always_run = true
pass_filenames = false
