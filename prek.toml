[[repos]]
repo = "local"

[[repos.hooks]]
id = "fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all"
stages = ["pre-commit"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets --all-features -- -D warnings"
stages = ["pre-commit"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "test"
name = "cargo test"
language = "system"
entry = "cargo test --all-targets --all-features"
stages = ["pre-push"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "coverage"
name = "cargo llvm-cov"
language = "system"
entry = "cargo llvm-cov --all-targets --all-features --summary-only"
stages = ["pre-push"]
always_run = true
pass_filenames = false
