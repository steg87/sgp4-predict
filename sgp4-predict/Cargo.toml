[package]
name = "sgp4-predict"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
chrono = "0.4.44"
sgp4 = "2.4.0"
thiserror = "2.0.18"
tracing = "0.1"

[dev-dependencies]
humantime = "2.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
