[package]
name = "sgp4-predict"
version = "0.3.0-rc.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Higher-level satellite pass prediction built on the sgp4 crate — transits, observations, areas of interest, apsides, and illumination"
repository = "https://github.com/steg87/sgp4-predict"
readme = "README.md"
keywords = ["sgp4", "satellite", "tle", "orbital-mechanics", "prediction"]
categories = ["aerospace", "science", "simulation"]

[features]
default = []
# Expose the generic event/window detection building blocks (EventIter,
# WindowIter, Detector, ...) that power the concrete iterators.
generics = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chrono = "0.4.44"
humantime = "2.1.0"
sgp4 = "2.4.0"
thiserror = "2.0.18"
tracing = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[lints]
workspace = true
