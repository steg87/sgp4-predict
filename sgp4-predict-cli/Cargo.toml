[package]
name = "sgp4-predict-cli"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Command-line interface for SGP4 satellite pass prediction"
repository = "https://github.com/steg87/sgp4-predict"
keywords = ["sgp4", "satellite", "tle", "orbital-mechanics", "prediction"]
categories = ["aerospace", "science", "simulation", "command-line-utilities"]

[[bin]]
name = "sgp4-predict"
path = "src/main.rs"
doc = false

[dependencies]
sgp4-predict       = { path = "../sgp4-predict", version = "0.3.1" }
clap               = { version = "4", features = ["derive"] }
anyhow             = "1"
humantime          = { workspace = true }
chrono             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde              = { workspace = true }
serde_yaml         = { workspace = true }
dirs               = "7"
clap_complete      = "4"
clap_mangen        = "0.3"

[dev-dependencies]
assert_approx_eq   = "1.1"

[lints]
workspace = true
