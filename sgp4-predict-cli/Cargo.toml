[package]
name = "sgp4-predict-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Command-line interface for SGP4 satellite pass prediction"
repository = "https://github.com/steg87/sgp4-predict"
readme = "README.md"
keywords = ["sgp4", "satellite", "tle", "orbital-mechanics", "prediction"]
categories = ["science", "simulation", "command-line-utilities"]

[[bin]]
name = "sgp4-predict"
path = "src/main.rs"

[dependencies]
sgp4-predict       = { path = "../sgp4-predict" }
clap               = { version = "4", features = ["derive"] }
anyhow             = "1"
humantime          = "2.1"
chrono             = "0.4"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
