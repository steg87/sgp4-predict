[package]
name = "sgp4-predict-py"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/steg87/sgp4-predict"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sgp4-predict = { path = "../sgp4-predict" }
pyo3 = { version = "0.28", features = ["chrono"] }
chrono = "0.4"
ouroboros = "0.18"
pyo3-stub-gen = "0.20"
serde_json = "1"

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
