name: Test

on:
  push:
    branches: [main, "*.x"]
  pull_request:
    branches: [main, "*.x"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: cargo test --all-targets --all-features
      # --all-targets skips doctests, which is where the README examples live.
      - run: cargo test --doc --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Build the docs a contributor gets
        run: cargo doc --all-features --no-deps
      - name: Build the docs docs.rs gets
        # Only this step compiles the `cfg_attr(docsrs, ...)` block, because
        # only this one passes --cfg docsrs — and docs.rs builds on nightly, so
        # a nightly rustdoc feature can be removed under us. Without it the
        # first sign of that is a failed build after publishing.
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly doc -p sgp4-predict --all-features --no-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Check each crate against its declared rust-version
        # Read the floor from Cargo.toml rather than repeating it here, so the
        # declaration stays the single source of truth. Without this a
        # dependency raising its own floor only surfaces in a user's report.
        #
        # No --locked: Cargo.lock is deliberately not committed for a library
        # workspace, so there is nothing to lock to. Resolving fresh is also
        # the more honest check — it is what a user installing on the declared
        # MSRV actually gets, and the MSRV-aware resolver picks accordingly.
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.rust_version) | "\(.name) \(.rust_version)"' \
            | while read -r name msrv; do
                echo "::group::$name (rust $msrv)"
                rustup toolchain install "$msrv" --profile minimal
                cargo +"$msrv" check -p "$name" --all-features || exit 1
                echo "::endgroup::"
              done

  versions:
    name: Version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: All crates share major.minor
        # The release pipeline assumes this invariant; see release.toml. Catching
        # a hand-edited manifest here beats discovering it mid-release.
        run: |
          cargo metadata --no-deps --format-version 1 > /tmp/meta.json
          if [ "$(jq -r '[.packages[] | .version | split("-")[0] | split(".")[0:2] | join(".")] | unique | length' /tmp/meta.json)" != 1 ]; then
            jq -r '.packages[] | "  \(.name) \(.version)"' /tmp/meta.json
            echo "::error::Crate versions do not share major.minor."
            exit 1
          fi
          jq -r '.packages[] | "\(.name) \(.version)"' /tmp/meta.json
