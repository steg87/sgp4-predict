name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtualenv and install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install "maturin>=1.0,<2.0" pytest ruff
        working-directory: sgp4-predict-py
      - name: Build and install bindings
        run: .venv/bin/maturin develop
        working-directory: sgp4-predict-py
      - name: Run tests
        run: .venv/bin/pytest tests/ -v
        working-directory: sgp4-predict-py
      - name: Generate type stubs
        run: cargo run --bin stub_gen
        working-directory: sgp4-predict-py
      - name: Lint and format check
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
        working-directory: sgp4-predict-py
